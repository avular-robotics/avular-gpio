name: PR Checks

on:
  pull_request:
    branches:
      - "*" # Run on all branches

jobs:
  check_pr:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Debian build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential debhelper dh-python python3-all python3-all-dev python3-setuptools devscripts lintian

      - name: Build Debian package
        run: |
          dpkg-buildpackage -us -uc -b

      - name: Lintian check
        run: |
          lintian ../*.deb || true  # Don't fail the build on lintian warnings

      - name: Build python package
        run: |
          python3 -m pip install --upgrade build
          python3 -m build
