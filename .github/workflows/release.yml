name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: avular-gpio

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential debhelper dh-python python3-all python3-all-dev python3-setuptools python3-venv devscripts

      - name: Create Debian source package
        run: |
          cd avular-gpio
          VERSION=$(dpkg-parsechangelog --show-field Version | sed 's/-[^-]*$//')
          cd ..
          echo "Creating source package with version: $VERSION"
          tar -czvf avular-gpio_${VERSION}.orig.tar.gz --exclude-vcs --exclude=avular-gpio/debian avular-gpio/

      - name: Build package
        run: |
          ls -l
          echo "Building package..."
          cd avular-gpio
          debuild -us -uc

      - name: Building python package
        run: |
          cd avular-gpio
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Create artifacts
        uses: actions/upload-artifact@v5
        with:
          name: avular-gpio-packages
          path: |
            *.deb

      - name: Avular GPIO Python package
        uses: actions/upload-artifact@v5
        with:
          name: avular-gpio-python-package
          path: |
            avular-gpio/dist/

  release-stable:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        environment: [stable, nightly, unstable]
    environment: ${{ matrix.environment }}
    steps:
      - name: Install dependencies
        run: sudo apt-get update && sudo DEBIAN_FRONTEND=noninteractive apt-get install -y lintian

      - name: Checkout private CI actions
        uses: actions/checkout@v4
        with:
          repository: avular-robotics/avular_ci
          ref: main
          path: avular_ci
          token: ${{ secrets.AVULAR_CI_READ_TOKEN }}

      - uses: ./avular_ci/actions/upload-packages
        with:
          artifact-name: avular-gpio-packages
          feed: "humble-${{ matrix.environment }}"
          distro: jammy
          component: main
          api-key: ${{ secrets.ROS_HUMBLE_UPLOAD_TOKEN }}

      - name: Remove downloaded artifacts
        run: rm -rf artifacts

      - uses: ./avular_ci/actions/upload-packages
        with:
          artifact-name: avular-gpio-packages
          feed: "${{ matrix.environment }}"
          distro: jammy
          component: main
          api-key: ${{ secrets.ROS_HUMBLE_UPLOAD_TOKEN }}

  release-pypi:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/Avular.GPIO

    steps:
      - name: Download Python package artifact
        uses: actions/download-artifact@v6
        with:
          name: avular-gpio-python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
