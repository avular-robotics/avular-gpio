name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: [self-hosted, micro-linux]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          path: avular-gpio

      - name: Install dependencies
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          sudo apt update
          sudo apt install -y build-essential debhelper dh-python python3-all python3-all-dev python3-setuptools devscripts

      - name: Create Debian source package
        run: |
          cd avular-gpio
          VERSION=$(dpkg-parsechangelog --show-field Version | sed 's/-[^-]*$//')
          cd ..
          echo "Creating source package with version: $VERSION"
          tar -czvf avular-gpio_${VERSION}.orig.tar.gz --exclude-vcs --exclude=avular-gpio/debian avular-gpio/

      - name: Build package
        run: |
          ls -l
          echo "Building package..."
          cd avular-gpio
          debuild -us -uc

      - name: Building python package
        run: |
          cd avular-gpio
          python3 -m pip install --upgrade build
          python3 -m build

      - name: Create artifacts
        uses: actions/upload-artifact@v5
        with:
          name: avular-gpio-packages
          path: |
            *.deb

      - name: Avular GPIO Python package
        uses: actions/upload-artifact@v5
        with:
          name: avular-gpio-python-package
          path: |
            avular-gpio/dist/

  release-stable:
    needs: build
    uses: avular-robotics/avular_ci/.github/workflows/upload-packages.yml@latest
    secrets: inherit
    strategy:
      matrix:
        environment: [stable, nightly, unstable]
    with:
      artifact-name: avular-gpio-packages
      environment: ${{ matrix.environment }}

  release-pypi:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
    environment:
      name: pypi
      url: https://pypi.org/p/Avular.GPIO

    steps:
      - name: Download Python package artifact
        uses: actions/download-artifact@v6
        with:
          name: avular-gpio-python-package
          path: dist/

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@ed0c53931b1dc9bd32cbe73a98c7f6766f8a527e # v1.13.0
